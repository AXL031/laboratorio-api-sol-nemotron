name: lab-nemotron
services:
  directo-postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    pull_policy: never
    container_name: lab-nemotron-b-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab_promociones
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - directo-data:/var/lib/postgresql/data
      - ./00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_promociones"]
      interval: 2s
      timeout: 3s
      retries: 30
  spec-postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    pull_policy: never
    container_name: lab-nemotron-d-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab_promociones
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - spec-data:/var/lib/postgresql/data
      - ./00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_promociones"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  directo-data:
  spec-data:
