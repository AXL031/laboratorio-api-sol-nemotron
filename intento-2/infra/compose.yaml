name: lab-sol-intento2
services:
  a2-postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    pull_policy: never
    container_name: lab-sol-a2-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab_promociones
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - a2-data:/var/lib/postgresql/data
      - ./00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_promociones"]
      interval: 2s
      timeout: 3s
      retries: 30
  c2-postgres:
    image: postgres@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    pull_policy: never
    container_name: lab-sol-c2-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
      POSTGRES_DB: lab_promociones
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - c2-data:/var/lib/postgresql/data
      - ./00-test-db.sql:/docker-entrypoint-initdb.d/00-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_promociones"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  a2-data:
  c2-data:
